name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      DEMO_MODE: 'true'
      APP_ENV: development
      MILVUS_ENABLED: 'false'
      AUTO_SYNC_ENABLED: 'false'
      EMBEDDING_PROVIDER: deterministic
      LLM_API_KEY: ''
      PIP_INDEX_URL: https://pypi.org/simple
      PIP_EXTRA_INDEX_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: >-
          python -m pip install --only-binary=:all: --index-url https://pypi.org/simple -r requirements.txt
        working-directory: backend
      - run: python -m security_patches --apply
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest app/tests -q
        working-directory: backend
      - name: Build offline CI sandbox image
        run: docker build -t codepilot-ci-python:local sandbox/python
      - name: Verify real sandbox isolation and lifecycle
        run: python -m pytest app/tests/test_ci_sandbox.py -k real_docker -q
        working-directory: backend
        env:
          CODEPILOT_SANDBOX_INTEGRATION: '1'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run test:lint-compat
      - run: npm run lint -- --max-warnings 0
      - run: npm run build
